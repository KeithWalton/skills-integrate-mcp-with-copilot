<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <div id="auth-status" class="auth-status">
        <span id="user-name" class="user-name hidden"></span>
        <button id="logout-btn" class="logout-btn hidden">Logout</button>
      </div>
    </header>

    <main>
      <!-- Authentication Section (shown when not logged in) -->
      <section id="auth-container" class="auth-container">
        <div id="auth-forms">
          <!-- Login Form -->
          <div id="login-form-div" class="auth-form">
            <h3>Login</h3>
            <form id="login-form">
              <div class="form-group">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" required placeholder="your-email@mergington.edu" />
              </div>
              <div class="form-group">
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" required />
              </div>
              <div class="form-group checkbox">
                <input type="checkbox" id="remember-me" />
                <label for="remember-me">Remember me for 30 days</label>
              </div>
              <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="form-toggle">Don't have an account? <a href="#" onclick="toggleAuthForm(event)">Sign up</a></p>
          </div>

          <!-- Sign Up Form -->
          <div id="signup-form-div" class="auth-form hidden">
            <h3>Create Account</h3>
            <form id="signup-form">
              <div class="form-group">
                <label for="signup-name">Full Name:</label>
                <input type="text" id="signup-name" required placeholder="John Doe" />
              </div>
              <div class="form-group">
                <label for="signup-email">Email:</label>
                <input type="email" id="signup-email" required placeholder="your-email@mergington.edu" />
              </div>
              <div class="form-group">
                <label for="signup-password">Password:</label>
                <input type="password" id="signup-password" required placeholder="At least 6 characters" />
              </div>
              <button type="submit" class="btn-primary">Create Account</button>
            </form>
            <p class="form-toggle">Already have an account? <a href="#" onclick="toggleAuthForm(event)">Login</a></p>
          </div>

          <div id="auth-message" class="hidden"></div>
        </div>
      </section>

      <!-- Main Content (shown when logged in) -->
      <section id="main-content" class="main-content hidden">
        <section id="activities-container">
          <h3>Available Activities</h3>
          <div id="activities-list">
            <!-- Activities will be loaded here -->
            <p>Loading activities...</p>
          </div>
        </section>

        <section id="signup-container">
          <h3>Sign Up for an Activity</h3>
          <form id="signup-activity-form">
            <div class="form-group">
              <label for="activity">Select Activity:</label>
              <select id="activity" required>
                <option value="">-- Select an activity --</option>
                <!-- Activity options will be loaded here -->
              </select>
            </div>
            <button type="submit" class="btn-primary">Sign Up</button>
          </form>
          <div id="message" class="hidden"></div>
        </section>

        <!-- Settings Section -->
        <section id="settings-container">
          <h3>Settings</h3>
          <button id="change-password-btn" class="btn-secondary">Change Password</button>
        </section>

        <!-- Change Password Modal -->
        <div id="password-modal" class="modal hidden">
          <div class="modal-content">
            <span class="close-btn" onclick="closePasswordModal()">&times;</span>
            <h3>Change Password</h3>
            <form id="change-password-form">
              <div class="form-group">
                <label for="old-password">Current Password:</label>
                <input type="password" id="old-password" required />
              </div>
              <div class="form-group">
                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" required placeholder="At least 6 characters" />
              </div>
              <div class="form-group">
                <label for="confirm-password">Confirm New Password:</label>
                <input type="password" id="confirm-password" required />
              </div>
              <button type="submit" class="btn-primary">Update Password</button>
            </form>
            <div id="password-message" class="hidden"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
